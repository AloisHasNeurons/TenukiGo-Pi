---
- name: Install camera applications (rpicam-apps)
  apt:
    name: rpicam-apps
    state: present

- name: Configure GPU Memory (256MB)
  lineinfile:
    path: /boot/config.txt
    regexp: '^gpu_mem='
    line: 'gpu_mem=256'
  notify: Reboot Raspberry Pi

- name: Enable Legacy Camera (fallback)
  lineinfile:
    path: /boot/config.txt
    regexp: '^start_x='
    line: 'start_x=1'
  when: ansible_distribution_release != 'bookworm'

- name: Create videos directory with permissions
  file:
    path: "{{ videos_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy camera capture script
  template:
    src: record_game.sh.j2
    dest: "{{ scripts_dir }}/record_game.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'