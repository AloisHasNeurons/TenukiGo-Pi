---
- name: Update APT cache and upgrade system
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install basic utility packages
  apt:
    name:
      - bc
      - iptables
      - python3
      - git
      - curl
      - ffmpeg
    state: present

# --- Fix for Kernel 6.12 Crash ---
- name: Apply brcmfmac driver workaround
  # This fixes the NULL pointer dereference in Kernel 6.12+ 
  # by disabling the specific offloading features that cause the crash.
  copy:
    dest: /etc/modprobe.d/brcmfmac.conf
    content: "options brcmfmac feature_disable=0x82000"
    mode: '0644'
  notify: Reboot System

- name: Configure Auto-Login
  import_tasks: autologin.yml