---
- name: Install hostapd and dnsmasq
  apt:
    name:
      - hostapd
      - dnsmasq
    state: present

- name: Configure hostapd (/etc/hostapd/hostapd.conf)
  template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart hostapd

- name: Point hostapd to configuration file
  lineinfile:
    path: /etc/default/hostapd
    regexp: '^#?DAEMON_CONF='
    line: 'DAEMON_CONF="/etc/hostapd/hostapd.conf"'

- name: Backup original dnsmasq.conf
  command: mv /etc/dnsmasq.conf /etc/dnsmasq.conf.bak
  args:
    creates: /etc/dnsmasq.conf.bak

- name: Configure dnsmasq (/etc/dnsmasq.conf)
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Disable services at boot (managed by scripts)
  service:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - hostapd
    - dnsmasq

- name: Create scripts directory
  file:
    path: "{{ scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy Python Wifi Server
  copy:
    src: server_wifi.py
    dest: "{{ scripts_dir }}/server_wifi.py"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy YouTube broadcast script
  copy:
    src: youtube_live.sh
    dest: "{{ scripts_dir }}/youtube_live.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy CLIENT mode network script (v2)
  copy:
    src: net_mode_client_v2.sh
    dest: "{{ scripts_dir }}/net_mode_client.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy AP mode network script (v2)
  copy:
    src: net_mode_ap_v2.sh
    dest: "{{ scripts_dir }}/net_mode_ap.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'