---
- name: Installation de hostapd et dnsmasq
  apt:
    name:
      - hostapd
      - dnsmasq
    state: present

- name: Configuration de hostapd (/etc/hostapd/hostapd.conf)
  template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart hostapd

- name: Pointer hostapd vers le fichier de configuration
  lineinfile:
    path: /etc/default/hostapd
    regexp: '^#?DAEMON_CONF='
    line: 'DAEMON_CONF="/etc/hostapd/hostapd.conf"'

- name: Backup de dnsmasq.conf original
  command: mv /etc/dnsmasq.conf /etc/dnsmasq.conf.bak
  args:
    creates: /etc/dnsmasq.conf.bak

- name: Configuration de dnsmasq (/etc/dnsmasq.conf)
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnsmasq

- name: Désactiver les services au démarrage (car gérés par les scripts)
  service:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - hostapd
    - dnsmasq

- name: Créer le dossier des scripts
  file:
    path: "{{ scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copier le serveur Wifi Python
  copy:
    src: server_wifi.py
    dest: "{{ scripts_dir }}/server_wifi.py"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copier le script de diffusion youtube
  copy:
    src: youtube_live.sh
    dest: "{{ scripts_dir }}/youtube_live.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copier le script de gestion réseau CLIENT (v2)
  copy:
    src: net_mode_client_v2.sh
    dest: "{{ scripts_dir }}/net_mode_client.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copier le script de gestion réseau AP (v2)
  copy:
    src: net_mode_ap_v2.sh
    dest: "{{ scripts_dir }}/net_mode_ap.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'