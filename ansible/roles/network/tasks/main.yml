---
- name: Install hostapd and dnsmasq
  apt:
    name:
      - hostapd
      - dnsmasq
    state: present

- name: Configure hostapd (/etc/hostapd/hostapd.conf)
  template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    owner: root
    group: root
    mode: '0600'

- name: Point hostapd to configuration file
  lineinfile:
    path: /etc/default/hostapd
    regexp: '^#?DAEMON_CONF='
    line: 'DAEMON_CONF="/etc/hostapd/hostapd.conf"'

- name: Backup original dnsmasq.conf
  command: mv /etc/dnsmasq.conf /etc/dnsmasq.conf.bak
  args:
    creates: /etc/dnsmasq.conf.bak

- name: Configure dnsmasq (/etc/dnsmasq.conf)
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'

- name: Disable services at boot (managed by scripts)
  service:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - hostapd
    - dnsmasq

- name: Configure NetworkManager to ignore Docker interfaces
  copy:
    src: nm_docker_ignore.conf
    dest: /etc/NetworkManager/conf.d/docker-ignore.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart NetworkManager

- name: Ensure NetworkManager is started and enabled
  service:
    name: NetworkManager
    state: started
    enabled: yes

- name: Create scripts directory
  file:
    path: "{{ scripts_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy Python Wifi Server
  template:
    src: server_wifi.py.j2
    dest: "{{ scripts_dir }}/server_wifi.py"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Deploy streaming script (start_streaming.sh)
  template:
    src: start_streaming.sh.j2
    dest: "{{ scripts_dir }}/start_streaming.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Remove legacy streaming script (youtube_live.sh)
  file:
    path: "{{ scripts_dir }}/youtube_live.sh"
    state: absent

- name: Ensure default stream config exists
  lineinfile:
    path: "{{ videos_dir }}/../stream_config.txt"
    line: "rtmp://172.20.10.3:1935/live/1"
    create: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"


- name: Copy CLIENT mode network script
  template:
    src: client_mode.sh.j2
    dest: "{{ scripts_dir }}/client_mode.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy AP mode network script
  template:
    src: ap_mode.sh.j2
    dest: "{{ scripts_dir }}/ap_mode.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'